[project]
name = "ctx-builder"
version = "0.1.0"
description = "Context Builder Agent — collects and builds AI-ready project context"
requires-python = ">=3.12"
  dependencies = [
      "click>=8.1",
      "tiktoken>=0.7",
      "pyyaml>=6.0",
      "langgraph>=1.2",
      "langchain-core>=1.4",
      "langchain-openai>=1.2",
      "langchain-anthropic>=1.2",
      "openai>=2.37",
      "python-dotenv>=1.0",
      "tree-sitter>=0.22",
      "tree-sitter-cpp>=0.23",
      "mcp>=1.0"
  ]

[project.optional-dependencies]
gitlab = ["python-gitlab>=5.0"]
claude = ["mcp>=1.0"]

[project.scripts]
ctx-build = "src.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
